[package]
name = "system-helper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "system-helper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-openai = { version = "0.41", features = ["_api", "chat-completion"] }
base64 = "0.22"
dirs = "6"
futures = "0.3"
image = "0.25"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
reqwest-eventsource = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
xcap = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
